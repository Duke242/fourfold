<style>
/* Layout: one-screen card table, built for a phone held upright first. Opponents along the top, piles in the middle,
   your fanned hand docked at the bottom. Cards follow the classic look: full-colour faces, a white border and a
   tilted white oval. The table stays dark green felt in either host theme. */
:root {
  --table: #0b3b2a;
  --table-2: #12573d;
  --rail: rgba(0, 0, 0, .28);
  --rail-2: rgba(255, 255, 255, .1);
  --ink: #111;
  --paper: #fff;
  --text: #f4f1ea;
  --muted: #b9cbbf;
  --accent: #ffd400;
  --red: #e5251f;
  --yellow: #f5c400;
  --green: #2f9e41;
  --blue: #1565c8;
  --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw: clamp(62px, min(23vw, 12.5vh), 100px);
  --cwt: clamp(80px, min(30vw, 16vh), 128px);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--table); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: radial-gradient(130% 75% at 50% 45%, var(--table-2), var(--table) 72%);
  background-color: var(--table);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  gap: 6px;
  max-width: 1100px;
  margin: 0 auto;
}

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { width: 24px; height: 24px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; font-style: italic; color: var(--accent); text-shadow: 2px 2px 0 var(--red); }
.target { font-size: 12px; color: var(--muted); white-space: nowrap; }
.bar-actions { display: flex; gap: 6px; }
.ghost { background: var(--rail); border: 0; border-radius: 10px; min-height: 44px; padding: 0 13px; cursor: pointer; font-size: 14px; font-weight: 600; }
.ghost:hover { background: var(--rail-2); }
.ghost { white-space: nowrap; }

/* Opponents */
.seats { display: flex; justify-content: center; gap: 8px; min-width: 0; }
.seat {
  flex: 1 1 0; max-width: 150px; min-width: 0;
  display: grid; gap: 4px; justify-items: center;
  padding: 7px 8px 8px; border-radius: 14px;
  background: var(--rail);
  border: 2px solid transparent;
  transition: border-color .25s, background .25s;
  position: relative;
}
.seat.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--rail)); }
.who { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; max-width: 100%; }
.who > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: var(--font-display); font-size: 13px; }
.flag { position: absolute; top: -9px; right: -4px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--accent); padding: 3px 6px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.fan { display: flex; height: 26px; padding-left: 9px; max-width: 100%; overflow: hidden; }
.mini { width: 18px; height: 26px; border-radius: 3px; margin-left: -9px; border: 1.5px solid var(--paper); background: radial-gradient(ellipse 40% 55% at 50% 50%, var(--red) 96%, transparent 100%) var(--ink); box-shadow: 1px 0 2px rgba(0,0,0,.4); }
.seat-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; }
.seat-meta b { color: var(--text); font-weight: 700; }
.dealer { font-style: normal; font-size: 10px; font-weight: 800; padding: 1px 4px; border-radius: 4px; background: var(--paper); color: var(--ink); }
.seat.exposed { border-color: var(--red); }
.catch { border: 0; border-radius: 10px; min-height: 44px; padding: 0 12px; font-size: 14px; font-weight: 800; background: var(--red); color: var(--paper); cursor: pointer; animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.06); } }

/* Table */
.table { display: grid; place-content: center; justify-items: center; gap: 10px; min-height: 0; overflow: hidden; }
.piles { display: flex; align-items: center; gap: clamp(24px, 9vw, 60px); padding-top: 6px; }
.table .card { --cw: var(--cwt); }
.pile { position: relative; padding: 0; border: 0; background: none; }
.pile.draw { cursor: pointer; border-radius: 12px; }
.pile.draw .card { box-shadow: 3px 3px 0 -1px var(--ink), 3px 3px 0 0 var(--paper), 6px 6px 0 -1px var(--ink), 6px 6px 0 0 var(--paper), 0 10px 22px rgba(0,0,0,.45); transition: transform .15s; }
.pile.draw:not(:disabled):hover .card { transform: translateY(-4px); }

.pile.draw:disabled { cursor: default; }
.pile-label { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.discard { width: var(--cwt); aspect-ratio: 5 / 7.6; position: relative; }
.discard .card { position: absolute; inset: 0; transform: rotate(var(--r, 0deg)); }
.discard .under { filter: brightness(.75); }
.discard .topcard.wild { box-shadow: 0 0 0 5px var(--chosen), 0 10px 22px rgba(0,0,0,.45); }
.discard .fresh { animation: land .42s cubic-bezier(.2,.8,.3,1.05); }
@keyframes land { from { transform: translate(var(--fx, 0px), var(--fy, -34px)) rotate(calc(var(--r, 0deg) - 18deg)) scale(.8); opacity: .5; } }

.stateline { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px; border-radius: 99px; background: var(--rail); font-size: 13px; font-weight: 700; }
.chip .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--paper); }
.chip .dot.any { background: conic-gradient(var(--red) 0 25%, var(--blue) 0 50%, var(--yellow) 0 75%, var(--green) 0); }
.chip svg { width: 16px; height: 16px; }
.chip.order svg { transition: transform .3s; }
.chip.order.rev svg { transform: scaleX(-1); }
.log { list-style: none; margin: 0 0 -6px; padding: 0; display: grid; gap: 2px; text-align: center; font-size: 12px; color: color-mix(in srgb, var(--muted) 70%, transparent); max-width: 52ch; }
.log li:first-child:not(:last-child) { opacity: .6; }
.status { margin: 0; min-height: 2.7em; max-width: 46ch; text-align: center; color: var(--text); font-size: 14px; line-height: 1.35; text-wrap: balance; }

/* Your area */
.me { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
.controls { display: flex; align-items: center; gap: 8px; }
.turn { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); line-height: 1.15; }
.turn.mine { color: var(--accent); }
.turn small { display: block; font-size: 11px; letter-spacing: .02em; text-transform: none; font-weight: 600; color: var(--muted); }
.btns { display: flex; gap: 6px; }
.btns button { border: 0; border-radius: 12px; min-height: 44px; padding: 0 14px; font-weight: 800; font-size: 14px; background: var(--paper); color: var(--ink); cursor: pointer; }
.btns button:disabled { background: var(--rail); color: color-mix(in srgb, var(--muted) 70%, transparent); cursor: default; }
.btns .call { font-family: var(--font-display); font-weight: 400; font-style: italic; letter-spacing: .01em; }
.btns .call:not(:disabled) { background: var(--red); color: var(--paper); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.btns .call.urgent { animation: pulse .5s ease-in-out infinite alternate; }
.btns .call.set { background: var(--rail); color: var(--accent); }
.hand { display: flex; overflow-x: auto; overflow-y: hidden; padding: 24px 6px 6px; scrollbar-width: none; overscroll-behavior-x: contain; }
.hand::-webkit-scrollbar { display: none; }
.hand > .card:first-child { margin-left: auto; }
.hand > .card:last-child { margin-right: auto; }
.hand > .card + .card { margin-left: calc(var(--cw) * var(--ov, .08)); }

/* Cards: white border, coloured face, tilted white oval, shadowed numerals. */
.card {
  --c: var(--ink);
  width: var(--cw);
  aspect-ratio: 5 / 7.6;
  flex: none;
  position: relative;
  display: block;
  padding: 0; border: 0;
  border-radius: calc(var(--cw) * .1);
  background: var(--paper);
  box-shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 14px rgba(0,0,0,.4);
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1;
  user-select: none; -webkit-user-select: none;
}
.card[data-suit="red"] { --c: var(--red); }
.card[data-suit="yellow"] { --c: var(--yellow); }
.card[data-suit="green"] { --c: var(--green); }
.card[data-suit="blue"] { --c: var(--blue); }
.card .face { position: absolute; inset: 6%; border-radius: calc(var(--cw) * .06); background: var(--c); overflow: hidden; }
.card .oval { position: absolute; left: 50%; top: 50%; width: 76%; height: 86%; border-radius: 50%; background: var(--paper); transform: translate(-50%, -50%) rotate(28deg) skewX(-4deg); }
.card .mid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c); }
.card .num { font-size: calc(var(--cw) * .56); font-style: italic; letter-spacing: -.03em; transform: translateX(-2%);
  text-shadow: calc(var(--cw) * -.012) calc(var(--cw) * -.012) 0 var(--ink), calc(var(--cw) * .012) calc(var(--cw) * -.012) 0 var(--ink), calc(var(--cw) * -.012) calc(var(--cw) * .012) 0 var(--ink), calc(var(--cw) * .025) calc(var(--cw) * .03) 0 var(--ink); }
.card .ul { text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .06em; }
.card .glyph { width: 58%; display: grid; place-items: center; filter: drop-shadow(calc(var(--cw) * .02) calc(var(--cw) * .025) 0 var(--ink)); }
.card .glyph svg { width: 100%; height: auto; display: block; overflow: visible; }
.card.k-flip .glyph svg, .card.k-flip .corner svg { transform: rotate(-45deg); }
.card .corner { position: absolute; top: 8.5%; left: 10.5%; font-size: calc(var(--cw) * .19); font-style: italic; color: var(--paper); display: flex; z-index: 1;
  --o: max(1px, calc(var(--cw) * .011));
  text-shadow: calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--ink), var(--o) calc(var(--o) * -1) 0 var(--ink), calc(var(--o) * -1) var(--o) 0 var(--ink), var(--o) var(--o) 0 var(--ink), 0 calc(var(--o) * 1.6) 0 var(--ink); }
.card .corner svg { width: 1em; height: 1em; filter: drop-shadow(1px 0 0 var(--ink)) drop-shadow(-1px 0 0 var(--ink)) drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 -1px 0 var(--ink)); }
.card .corner.br { top: auto; left: auto; bottom: 8.5%; right: 10.5%; transform: rotate(180deg); }
/* Draw Two: two overlapping mini cards in the oval. */
.card .stack { position: relative; width: 46%; aspect-ratio: 1; }
.card .stack i { position: absolute; width: 52%; aspect-ratio: 5 / 7.6; border-radius: 12%; background: var(--c); border: calc(var(--cw) * .018) solid var(--paper); box-shadow: 0 0 0 calc(var(--cw) * .012) var(--ink), calc(var(--cw) * .02) calc(var(--cw) * .02) 0 var(--ink); }
.card .stack i:nth-child(1) { left: 8%; top: 6%; transform: rotate(-14deg); }
.card .stack i:nth-child(2) { left: 38%; top: 22%; transform: rotate(10deg); }
/* Wilds: black face with a four-colour oval, or four fanned cards for Draw Four. */
.card.wild .face { background: var(--ink); }
.card.wild .oval { background: conic-gradient(from -28deg, var(--red) 0 25%, var(--blue) 0 50%, var(--yellow) 0 75%, var(--green) 0); box-shadow: 0 0 0 calc(var(--cw) * .025) var(--paper); }
.card.k-shift4 .oval { width: 70%; height: 80%; background: var(--ink); box-shadow: 0 0 0 calc(var(--cw) * .02) var(--paper); }
.card .four { position: relative; width: 62%; aspect-ratio: 1; }
.card .four i { position: absolute; width: 38%; aspect-ratio: 5 / 7.6; border-radius: 12%; border: calc(var(--cw) * .015) solid var(--paper); box-shadow: calc(var(--cw) * .012) calc(var(--cw) * .012) 0 rgba(0,0,0,.6); }
.card .four i:nth-child(1) { background: var(--blue); left: 4%; top: 22%; transform: rotate(-18deg); }
.card .four i:nth-child(2) { background: var(--green); left: 24%; top: 6%; transform: rotate(-6deg); }
.card .four i:nth-child(3) { background: var(--red); left: 38%; top: 30%; transform: rotate(6deg); }
.card .four i:nth-child(4) { background: var(--yellow); left: 58%; top: 16%; transform: rotate(18deg); }
.card .corner .wdot { width: .8em; height: 1.05em; border-radius: 50%; transform: rotate(28deg); background: conic-gradient(from -28deg, var(--red) 0 25%, var(--blue) 0 50%, var(--yellow) 0 75%, var(--green) 0); box-shadow: 0 0 0 calc(var(--cw) * .008) var(--paper); }
/* Back: black with a red oval and the wordmark. */
.card.back .face { background: var(--ink); }
.card.back .oval { background: var(--red); }
.card.back .mid { color: var(--accent); }
.card.back .word { font-size: calc(var(--cw) * .2); font-style: italic; transform: rotate(-28deg); text-shadow: calc(var(--cw) * .018) calc(var(--cw) * .022) 0 var(--ink); text-align: center; line-height: .9; }

.hand .card { transition: transform .15s, filter .2s, box-shadow .15s; cursor: default; }
.hand .card.playable { cursor: pointer; transform: translateY(-12px); box-shadow: 0 0 0 2.5px var(--accent), 0 10px 20px rgba(0,0,0,.5); }
@media (hover: hover) { .hand .card.playable:hover { transform: translateY(-20px); z-index: 2; } }
.hand .card.playable:focus-visible { transform: translateY(-20px); z-index: 2; }
.hand .card.playable:active { transform: translateY(-16px) scale(.97); }
.hand .card.dim { filter: saturate(.75) brightness(.7); }
.hand .card.arrive { animation: arrive .35s cubic-bezier(.2,.8,.3,1.1); }
@keyframes arrive { from { transform: translateY(-60px) scale(.85); opacity: 0; } }
.seat.grew .seat-meta, .seat.grew .fan { animation: grew .5s ease-out; }
@keyframes grew { 30% { transform: scale(1.18); color: var(--red); } }
.hand .card.drawn { box-shadow: 0 0 0 3.5px var(--accent), 0 10px 20px rgba(0,0,0,.5); }

.tag { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--rail-2); color: var(--muted); }
/* Online rooms */
.sheet h2 .code { font-family: var(--font-display); letter-spacing: .12em; color: var(--accent); }
.sheet input { font: inherit; font-size: 16px; color: var(--text); background: var(--rail); border: 1.5px solid var(--rail-2); border-radius: 10px; min-height: 46px; padding: 0 12px; width: 100%; }
.sheet input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.sheet input::placeholder { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.sheet .codein { font-family: var(--font-display); font-size: 24px; letter-spacing: .3em; text-transform: uppercase; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.plist li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--rail); color: var(--text); font-weight: 700; }
.plist li small { margin-left: auto; font-weight: 600; color: var(--muted); }
.plist li.bots { background: none; color: var(--muted); font-weight: 600; padding: 2px 10px; }
.divider { border-top: 1px solid var(--rail-2); padding-top: 14px; }
.row.start { justify-content: flex-start; }
.netmsg { color: var(--accent) !important; }
.sheet p.wait { flex: 1; text-align: center; }
/* Sheets: centred dialogs on wide screens, bottom sheets on phones. */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.overlay[hidden] { display: none; }
.sheet { width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: #173f30; border: 1px solid var(--rail-2); border-radius: 20px; padding: 22px; display: grid; gap: 16px; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet p, .sheet li { margin: 0; color: var(--muted); line-height: 1.5; }
.sheet strong { color: var(--text); font-weight: 700; }
.suits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.suit-btn { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 16px; border-radius: 14px; border: 3px solid var(--paper); background: var(--c); color: var(--paper); font-weight: 800; font-size: 17px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
#suit-yellow { color: var(--ink); text-shadow: none; }
.suit-btn small { margin-left: auto; font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.primary { border: 0; border-radius: 12px; min-height: 46px; padding: 0 20px; font-weight: 800; background: var(--accent); color: var(--ink); cursor: pointer; }
.secondary { border: 1.5px solid var(--rail-2); border-radius: 12px; min-height: 46px; padding: 0 18px; font-weight: 700; background: transparent; cursor: pointer; }
.field { display: grid; gap: 8px; }
.field > span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1.5px solid var(--rail-2); background: transparent; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.tally { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.tally > div { display: flex; flex-wrap: wrap; row-gap: 6px; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: var(--rail); }
.tally > div.win { box-shadow: inset 0 0 0 2px var(--accent); }
.tally > div > span:nth-child(2) { color: var(--muted); }
.minis { display: flex; flex-wrap: wrap; gap: 3px; width: 100%; }
.minis .card { --cw: 28px; box-shadow: none; }
.minis .card .corner { display: none; }
.minis.reveal { gap: 6px; }
.minis.reveal .card { --cw: 46px; }
.minis.reveal .card.hit { box-shadow: 0 0 0 3px var(--accent); }
.catch-row { justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.legend .card { --cw: 44px; }
.legend .card .corner { display: none; }

@media (max-width: 560px) {
  .overlay { place-items: end stretch; padding: max(16px, env(safe-area-inset-top, 0px)) 0 0; }
  .sheet { width: 100%; border-radius: 22px 22px 0 0; border-width: 1px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: rise .25s cubic-bezier(.2,.8,.3,1); }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } }
  .row > button { flex: 1; }
  .catch-row > span { flex-basis: 100%; }
}
@media (max-width: 400px) {
  .brand h1 { font-size: 19px; }
  .ghost { padding: 0 10px; font-size: 13px; }
  .target { display: none; }
  .btns button { padding: 0 11px; font-size: 13px; }
  .seat { padding: 6px 5px 7px; }
  .who { font-size: 13px; }
}
@media (max-width: 360px) {
  .brand h1 { font-size: 16px; }
  .brand svg { width: 20px; height: 20px; }
  .bar { gap: 6px; }
  .ghost { padding: 0 9px; }
}
/* Short screens: phones in landscape. Opponents and piles get smaller so your hand keeps its size. */
@media (max-height: 700px) and (orientation: portrait) {
  :root { --cwt: clamp(70px, min(26vw, 15vh), 110px); }
  .log { display: none; }

const $ = id => document.getElementById(id);

let state = null, botTimer = null, catchTimer = null, catchArmed = false, lastTop = null, seenIds = new Set(), lastCounts = [], lastDeal = null;
